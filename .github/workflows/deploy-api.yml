name: deploy-api
on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/**', 'supabase/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      # Secrets first, so a fresh deploy never boots without its environment.
      - run: >-
          supabase secrets set --project-ref "$PROJECT_ID"
          ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      - run: supabase functions deploy analyze --project-ref "$PROJECT_ID"
