name: keepalive
# A free Supabase project is paused after a week without requests. The health check also
# consumes the rate-limit RPC, so the database sees activity too.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The first allowed origin stands in for the browser; /healthz answers 403 without one.
      - run: >-
          curl --fail --silent --show-error
          -H "Origin: ${ALLOWED_ORIGINS%%,*}"
          "$API_URL/healthz"
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          API_URL: ${{ vars.VITE_API_URL }}
